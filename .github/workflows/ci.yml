name: CI

on:
  push:
    branches: [main, "features/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (unit, API, architecture and migration tests)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports

  backend-mariadb:
    # The same Flyway migrations, on the database used in production.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Create the two disposable databases
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "create database tb_fresh; create database tb_legacy;"
      - name: Migration test on MariaDB
        working-directory: backend
        run: >
          mvn -B -ntp test -pl monolith -am -Dsurefire.failIfNoSpecifiedTests=false -Dtest=MariaDbMigrationTest
          -Dtest.mariadb.fresh=jdbc:mariadb://127.0.0.1:3306/tb_fresh
          -Dtest.mariadb.legacy=jdbc:mariadb://127.0.0.1:3306/tb_legacy
          -Dtest.mariadb.user=root -Dtest.mariadb.password=root

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Architecture + code rules
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  images:
    # Proves that every Dockerfile build still works; nothing is pushed.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        module: [monolith, services/notification-service, platform/discovery-server, platform/config-server, platform/api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: MODULE=${{ matrix.module }}
          push: false
          cache-from: type=gha,scope=backend-${{ strategy.job-index }}
          cache-to: type=gha,scope=backend-${{ strategy.job-index }},mode=max

  frontend-image:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: API_BASE_URL=http://localhost:8080
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
