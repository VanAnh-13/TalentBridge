spring.application.name=TalentBridge-Backend
# Database connection config (H2 in-memory for development)
spring.datasource.url=jdbc:h2:mem:talentbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.h2.console.enabled=true
# Schema is owned by Flyway (src/main/resources/db/migration). Databases created before Flyway
# (by ddl-auto=update) are baselined at V1 and only receive V2+.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Config
# DEV ONLY: Base64 key, >= 64 bytes (HS512). Production must set JWT_SECRET (e.g. `openssl rand -base64 64`).
# Tokens are signed with RS256. Development falls back to a throw-away key (a restart signs everybody out);
# production must provide JWT_PRIVATE_KEY (see application-prod.properties). Public keys: GET /.well-known/jwks.json
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.key-id=${JWT_KEY_ID:}
jwt.generate-key-if-missing=true
jwt.issuer=talentbridge-auth
jwt.access-token-expiration=300
jwt.refresh-token-expiration=86400
# Pagination Config
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=20
# Google Cloud Storage (disabled for development - uncomment and fill when needed)
#gcs.project-id=YOUR_GCS_PROJECT_ID
#gcs.bucket-name=YOUR_GCS_BUCKET_NAME
#gcs.credentials-path=./gcs-credentials.json
# Redis (disabled for development - uncomment when using Redis)
#redis.host=localhost
#redis.port=6379
#redis.password=
# Caching (using simple in-memory cache)
spring.cache.type=simple
# Swagger
springdoc.api-docs.path=/v3/api-docs
# Mail Sender (disabled for development - uncomment and fill when needed)
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#mail.from=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# CORS (frontend origins for local development)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# DEV ONLY first-run admin (H2). Not applied in prod: application-prod.properties reads BOOTSTRAP_ADMIN_* env instead.
app.bootstrap.admin-email=dev-admin@talentbridge.com
app.bootstrap.admin-password=Admin@123456

# Development only: log the password-reset link when no mail server is configured
app.mail.log-reset-links=true

# No Redis in development (refresh tokens are kept in memory), so its health check must not report DOWN
management.health.redis.enabled=false

# AI CV-job matching (Claude API). Off until an API key is provided; the model is configurable.
app.matching.api-key=${ANTHROPIC_API_KEY:}
app.matching.model=${MATCHING_MODEL:claude-opus-5-5}
app.matching.base-url=${ANTHROPIC_BASE_URL:}
app.matching.async=true
