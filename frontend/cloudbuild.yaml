# Cloud Build configuration for Vite React app
# Build Docker image and deploy to Cloud Run. The API address is baked into the bundle, so it must be given:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_API_BASE_URL=https://api.example.com

substitutions:
  _API_BASE_URL: ""  # public address of the API gateway the browser calls (required)
  _REGION: "asia-southeast1"
  _REPO: "talentbridge"
  _SERVICE_NAME: "talentbridge-frontend"

steps:
  # Stop early when the API address is missing: the app would call nothing
  - name: 'bash'
    args: ['-c', 'test -n "${_API_BASE_URL}" || { echo "Set _API_BASE_URL (--substitutions=_API_BASE_URL=https://...)"; exit 1; }']
    id: 'check-substitutions'

  # Build the Docker image with API_BASE_URL
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'API_BASE_URL=${_API_BASE_URL}'
      - '.'
    id: 'build-image'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
    id: 'push-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # the frontend is public
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
    id: 'deploy-cloud-run'

# Images pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
