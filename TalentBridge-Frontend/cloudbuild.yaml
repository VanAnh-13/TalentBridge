steps:
  # Build the container image with build-arg
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/talentbridge/talentbridge-frontend:latest'
      - '.'
  
  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/talentbridge/talentbridge-frontend:latest']

substitutions:
  _VITE_API_URL: 'http://localhost:8080' # Default value

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/talentbridge/talentbridge-frontend:latest'
