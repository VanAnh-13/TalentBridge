# Whole TalentBridge stack for local use:  cp .env.example .env  (fill JWT_PRIVATE_KEY)  &&  docker compose up --build
#   web  http://localhost:3000        api (gateway)  http://localhost:8080        Eureka  http://localhost:8761
# The browser only talks to the gateway; services find each other through Eureka and read shared settings from
# the config server.
services:
  mariadb:
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-talentbridge}
      MYSQL_USER: ${DB_USER:-talentbridge_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talentbridge_pass}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./infra/mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  discovery:
    build:
      context: ./backend
      args:
        MODULE: platform/discovery-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: discovery

  config:
    build:
      context: ./backend
      args:
        MODULE: platform/config-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8888

  gateway:
    build:
      context: ./backend
      args:
        MODULE: platform/api-gateway
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      CONFIG_SERVER_ENABLED: "true"
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery:8761/eureka
      ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy

  monolith:
    build:
      context: ./backend
      args:
        MODULE: monolith
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      CONFIG_SERVER_ENABLED: "true"
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery:8761/eureka
      EVENTS_RELAY_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-talentbridge}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-talentbridge_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-talentbridge_pass}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      SPRING_CACHE_TYPE: redis
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env (see .env.example)}
      ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MATCHING_MODEL: ${MATCHING_MODEL:-claude-opus-5-5}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@talentbridge.com}
      FRONTEND_URL: ${WEB_ORIGIN:-http://localhost:3000}
      APP_TIME_ZONE: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      args:
        MODULE: services/notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      CONFIG_SERVER_ENABLED: "true"
      CONFIG_SERVER_URL: http://config:8888
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:mariadb://mariadb:3306/notification_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-talentbridge_user}
      DB_PASSWORD: ${DB_PASSWORD:-talentbridge_pass}
      JWKS_URI: http://monolith:8081/.well-known/jwks.json
      ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the gateway directly, so this is its address as seen from the host.
        API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      - gateway

volumes:
  mariadb-data:
  kafka-data:
  uploads:
