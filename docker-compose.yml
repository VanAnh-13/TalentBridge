# Whole TalentBridge stack for local use:  cp .env.example .env  (fill JWT_PRIVATE_KEY)  &&  docker compose up --build
#   web  http://localhost:3000        api  http://localhost:8080 (Swagger: /swagger-ui.html)
services:
  mariadb:
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-talentbridge}
      MYSQL_USER: ${DB_USER:-talentbridge_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talentbridge_pass}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

  backend:
    build:
      context: ./backend
      args:
        MODULE: monolith
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-talentbridge}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-talentbridge_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-talentbridge_pass}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      SPRING_CACHE_TYPE: redis
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env (see .env.example)}
      ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MATCHING_MODEL: ${MATCHING_MODEL:-claude-opus-5-5}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@talentbridge.com}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the address as seen from the host.
        API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      - backend

volumes:
  mariadb-data:
  uploads:
